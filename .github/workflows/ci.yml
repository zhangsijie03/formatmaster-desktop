name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: 安装 Ubuntu 运行时工具
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libegl1

      - name: 安装 macOS 运行时工具
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: 安装 Windows 运行时工具
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress

      - name: 验证媒体工具
        run: |
          ffmpeg -version
          ffprobe -version

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: 仓库发布卫生预检
        run: python scripts/release_preflight.py

      - name: Ruff 静态检查
        run: python -m ruff check

      - name: Python 测试
        run: python -m pytest -q
